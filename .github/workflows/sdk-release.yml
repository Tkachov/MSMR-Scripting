name: SDK Release

permissions:
  contents: write
  packages: read

on:
  push:
    tags:
      - "SDK/v*"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: "MSMR-Script-SDK/vcpkg.json"
          vcpkgGitCommitId: "0b63bdd30d6716affc6fc0caef3886ca3022dc7b"
        env:
          VCPKG_BINARY_SOURCES: default,readwrite

      - name: Restore vcpkg packages
        shell: pwsh
        run: vcpkg integrate install

      - name: Build SDK pack
        shell: pwsh
        run: msbuild /p:Configuration=Pack /p:Platform=x64 MSMR-Script-SDK\MSMR-Script-SDK.vcxproj

      - name: Prepare SDK release assets
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "MSMR-Script-SDK"
          $headersRoot = (Resolve-Path "MSMR-Script-SDK\game").Path
          $includeRoot = Join-Path $packageDir "include\game"
          $libRoot = Join-Path $packageDir "lib"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $includeRoot, $libRoot | Out-Null

          Copy-Item "x64\Release\MSMR-Script-SDK.lib" $libRoot
          Get-ChildItem $headersRoot -Filter *.h -Recurse | ForEach-Object {
            $relativePath = $_.FullName.Substring($headersRoot.Length + 1)
            $destinationPath = Join-Path $includeRoot $relativePath
            New-Item -ItemType Directory -Force -Path (Split-Path $destinationPath) | Out-Null
            Copy-Item $_.FullName $destinationPath
          }

          if (Test-Path "x64\Pack\MSMR-Script-SDK.zip") {
            Remove-Item "x64\Pack\MSMR-Script-SDK.zip" -Force
          }

          if (Test-Path "x64\Pack\MSMR-Script-SDK-dev.zip") {
            Remove-Item "x64\Pack\MSMR-Script-SDK-dev.zip" -Force
          }

          Compress-Archive -Path "x64\Pack\MSMR-Script-SDK.script" -DestinationPath "x64\Pack\MSMR-Script-SDK.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "x64\Pack\MSMR-Script-SDK-dev.zip"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          body: ""
          artifacts: "x64/Pack/MSMR-Script-SDK.zip,x64/Pack/MSMR-Script-SDK-dev.zip"
